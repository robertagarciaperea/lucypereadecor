name: medir
on: {push: {branches: [medir]}}
permissions: {contents: write}
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow -q
          mkdir -p out
          for f in 9b2f0ea800165049fcc346e29168ce19.png 2dc76d08d6b4359b8f4dd96060cd620d.png 6ddc39b731ee25d8cc77ff3fbd27a0bc.png d14dbd9b476e70b4b90f8b7f7f493f1e.png b2ecbb2cbe7d0c6b29e18afc9d54de2e.png 96412652ca290b4179edaefa94f1d010.png; do curl -sL -o out/$f "https://robertagarciabook.my.canva.site/lucypereadecor-catalogo/_assets/media/$f" || echo "fail $f"; done
          python medir.py > out/sizes.txt
          git config user.name Claude; git config user.email noreply@anthropic.com
          git add out && git commit -m medido && git push

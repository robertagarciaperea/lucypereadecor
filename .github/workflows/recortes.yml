name: recortes
on:
  push:
    branches: [recortes]
    paths: [".github/workflows/recortes.yml"]
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "rembg[cpu]" pillow
      - name: Recortar Burgundy
        run: |
          mkdir -p raw img/col/fix
          curl -sfL -o raw/b.jpg "https://robertagarciabook.my.canva.site/lucypereadecor-catalogo/_assets/media/08c15db36af9b38c6b895abc22e3c094.jpg"
          python - <<'PY'
          from rembg import remove, new_session
          from PIL import Image
          im = Image.open("raw/b.jpg").convert("RGB")
          w, h = im.size
          im = im.crop((0, 0, int(w * 0.66), h))
          im.thumbnail((1200, 1200))
          for m in ("birefnet-general", "isnet-general-use"):
              out = remove(im, session=new_session(m))
              out = out.crop(out.getchannel("A").point(lambda a: 255 if a > 20 else 0).getbbox())
              out.save(f"img/col/fix/08c15db3-{m}.png", optimize=True)
          PY
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add img/col && git commit -m "Recorte burgundy" && git push
